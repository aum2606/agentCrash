[project]
name = "agentcrash"
version = "0.0.0"
description = "Local chaos-testing lab for AI agents (pre-release; M0 toolchain baseline)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1,<2",
    "fastapi>=0.162.2,<0.163",
    "psycopg[binary]>=3.3.8,<4",
    "pyyaml>=6.0.3,<7",
    "sqlalchemy>=2.1.8,<2.2",
    "typer>=0.28.0,<0.29",
    "uvicorn>=0.54.0,<0.55",
]

[project.scripts]
agentcrash = "agentcrash.cli.main:app"

[dependency-groups]
dev = [
    "httpx2>=2.16.0,<3",
    "hypothesis>=6.170.15,<7",
    "mypy>=2.4.1,<2.5",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.4,<0.18",
    "types-pyyaml>=6.0.12.20261103,<7",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "migrations"]
mypy_path = ["src", "tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config"
