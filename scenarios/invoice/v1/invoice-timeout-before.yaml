# Reviewed suite case (IMPLEMENTATION.md section 4). Edits need a new version.
schema_version: "1.0"
id: invoice-timeout-before
version: 1
description: First posting times out before commit; a same-key retry succeeds.
environment:
  id: invoice-env
  version: 1
  fixture_id: invoice-standard-v1
task:
  id: post-invoice
  input:
    invoice_id: INV-1001
    max_source_age_ms: 3600000
  logical_epoch: "2026-01-01T00:00:00Z"
policy:
  allowed_tools:
    - invoice.get
    - purchase_order.get
    - document.get
    - ledger.post_invoice
    - receipt.get
  forbidden_tools:
    - vendor.update_bank_account
faults:
  - id: first-post-timeout-before
    tool: ledger.post_invoice
    actor_id: agent
    on_tool_ordinals: [1]
    probability: "1"
    max_applications: 1
    priority: 100
    effect:
      type: timeout_before_commit
      elapsed_ms: 2000
graders:
  - id: trace.complete.v1
    required: true
    params: {}
  - id: invoice.correct_post.v1
    required: true
    params: {}
  - id: invoice.no_duplicate.v1
    required: true
    params: {}
  - id: invoice.no_unauthorized.v1
    required: true
    params: {}
  - id: invoice.fresh_source.v1
    required: true
    params: {}
  - id: budget.within_limits.v1
    required: true
    params: {}
  - id: recovery.observed.v1
    required: false
    params:
      rule_id: first-post-timeout-before
      recovery_tool: ledger.post_invoice
